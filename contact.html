<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/sports-central.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Sports Central</title>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="images/sports-central-logo.png" alt="Sports Central logo" width="80">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="news.html">News</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <form action="#" method="get" class="search-bar">
            <input type="text" placeholder="Search...">
            <button type="submit">Go</button>
        </form>
    </header>
    <main>
        <div class="hero">
            <img src="images/sports-central-logo.png" alt="Sports Central logo" width="50" class="hero-logo">
            <h1>Contact Us</h1>
            <p>We’d love to hear from you! Fill out the form below to get in touch.</p>
        </div>
        <div class="contact-container">
            <section id="contact-form">
                <h2>Get in Touch</h2>
                <form action="#" method="post">
                    <div class="form-group">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" placeholder="Your Name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" placeholder="Your Email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message:</label>
                        <textarea id="message" name="message" placeholder="Your Message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Submit</button>
                </form>
                <div class="success-message" style="display: none;">Thanks for reaching out!</div> <!-- Hidden by default -->
            </section>
        </div>
    </main>
    <footer>
        <p>© 2025 Sports Central. All rights reserved.</p>
    </footer>
</body>
</html>
